name: Build and Deploy indicator-ai to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SERVICE_NAME: indicator-ai
  REGION: asia-southeast1 # Update to your preferred Google Cloud region

jobs:
  deploy-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      # Sanitize project ID
      - name: Sanitize GCP Project ID
        run: echo "GCP_PROJECT_ID=$(echo '${{ secrets.GCP_PROJECT_ID }}' | tr -d '[:space:]')" >> $GITHUB_ENV

      # Set up Cloud SDK
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      # Build .env.cloudrun dynamically from Github Secrets
      - name: Create .env.cloudrun
        run: |
          echo "" > .env.cloudrun
          echo "GEMINI_API_KEY: \"${{ secrets.GEMINI_API_KEY }}\"" >> .env.cloudrun
          echo "JWT_SECRET: \"${{ secrets.JWT_SECRET }}\"" >> .env.cloudrun
          echo "UPSTOX_ACCESS_TOKEN: \"${{ secrets.UPSTOX_ACCESS_TOKEN }}\"" >> .env.cloudrun
          echo "GROQ_API_KEY: \"${{ secrets.GROQ_API_KEY }}\"" >> .env.cloudrun
          echo "OPENROUTER_API_KEY: \"${{ secrets.OPENROUTER_API_KEY }}\"" >> .env.cloudrun
          echo "CEREBRAS_API_KEY: \"${{ secrets.CEREBRAS_API_KEY }}\"" >> .env.cloudrun
          echo "UPSTASH_REDIS_URL: \"${{ secrets.UPSTASH_REDIS_URL }}\"" >> .env.cloudrun
          echo "UPSTASH_REDIS_TOKEN: \"${{ secrets.UPSTASH_REDIS_TOKEN }}\"" >> .env.cloudrun
          echo "✅ Generated valid YAML .env.cloudrun for Cloud Run deployment"

      # Build Docker images
      - name: Build Docker images
        run: |
          docker build -t gcr.io/${{ env.GCP_PROJECT_ID }}/indicator-market:${{ github.sha }} -f Dockerfile.market .
          docker build -t gcr.io/${{ env.GCP_PROJECT_ID }}/indicator-chat:${{ github.sha }} -f Dockerfile.chat .
          docker build -t gcr.io/${{ env.GCP_PROJECT_ID }}/indicator-scheduler:${{ github.sha }} -f Dockerfile.scheduler .

      # Push Docker images to GCR
      - name: Push Docker images
        run: |
          gcloud auth configure-docker gcr.io --quiet
          docker push gcr.io/${{ env.GCP_PROJECT_ID }}/indicator-market:${{ github.sha }}
          docker push gcr.io/${{ env.GCP_PROJECT_ID }}/indicator-chat:${{ github.sha }}
          docker push gcr.io/${{ env.GCP_PROJECT_ID }}/indicator-scheduler:${{ github.sha }}

      # Deploy Market API to Cloud Run
      - name: Deploy Market API
        run: |
          gcloud run deploy indicator-market \
            --image gcr.io/${{ env.GCP_PROJECT_ID }}/indicator-market:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --env-vars-file .env.cloudrun \
            --port 8000 \
            --cpu 1 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 10

      # Deploy Chat API to Cloud Run
      - name: Deploy Chat API
        run: |
          gcloud run deploy indicator-chat \
            --image gcr.io/${{ env.GCP_PROJECT_ID }}/indicator-chat:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --env-vars-file .env.cloudrun \
            --port 8001 \
            --cpu 1 \
            --memory 2Gi \
            --min-instances 0 \
            --max-instances 10

      # Deploy Background Scheduler to Cloud Run
      - name: Deploy Scheduler
        run: |
          gcloud run deploy indicator-scheduler \
            --image gcr.io/${{ env.GCP_PROJECT_ID }}/indicator-scheduler:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --no-allow-unauthenticated \
            --env-vars-file .env.cloudrun \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --min-instances 1 \
            --max-instances 1
